services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      XLEMMA_BIND: 0.0.0.0:8080
      RUST_LOG: info,xlemma_api=debug
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: xlemma
      POSTGRES_PASSWORD: xlemma-local-only
      POSTGRES_DB: xlemma
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlemma"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: xlemma-local
      MINIO_ROOT_PASSWORD: xlemma-local-password
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  nats-data:
  minio-data:
