openapi: 3.1.0
info:
  title: xLemma Protocol API
  version: 1.0.0
  description: >-
    HTTP adapter for canonical XLMP/1 messages and reference endpoints for
    decentralized researcher identities, proof-production jobs, independent
    verification, node discovery and service orders, auditable committee
    sortition, PoIR observations, compute quotes, optional x402 payments,
    novelty review, researcher sovereignty and portability, generalized
    verification profiles, economic compliance, and lemma capsules.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /v1/discovery/commands:
    post:
      operationId: acceptDiscoveryCommand
      summary: Authenticate and durably append a discovery command
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../schemas/discovery-envelope.schema.json' }
      responses:
        '202':
          description: Fsynced command accepted; not a payment receipt
          content:
            application/json:
              schema:
                type: object
                required: [command_id, accepted_at]
                properties:
                  command_id: { type: string }
                  accepted_at: { type: string, format: date-time }
        '400': { description: Invalid signature, replay, evidence or state transition }
        '401': { description: Missing or invalid API authentication }
        '500': { description: Durable storage unavailable; command not acknowledged }
  /v1/discovery/rounds:
    get:
      operationId: discoveryRounds
      summary: Published policies, confirmed funding, capacity and settlement status
      responses:
        '200':
          description: Published policies, confirmed funding, capacity and settlement status
          content:
            application/json:
              schema:
                type: object
        '400': { description: Invalid identifier or unavailable evidence }
        '401': { description: Missing or invalid API authentication }
        '404': { description: Requested record not found }
  /v1/discovery/rounds/{round_id}/queue:
    get:
      operationId: discoveryQueue
      summary: Commitment-ordered admitted work; admission is not scientific importance
      parameters:
        - name: round_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Commitment-ordered admitted work; admission is not scientific importance
          content:
            application/json:
              schema:
                type: array
                items: { type: object }
        '400': { description: Invalid identifier or unavailable evidence }
        '401': { description: Missing or invalid API authentication }
        '404': { description: Requested record not found }
  /v1/discovery/rounds/{round_id}/history:
    get:
      operationId: discoveryHistory
      summary: Signed append-only commands and decision commitments
      parameters:
        - name: round_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Signed append-only commands and decision commitments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '../schemas/discovery-envelope.schema.json' }
        '400': { description: Invalid identifier or unavailable evidence }
        '401': { description: Missing or invalid API authentication }
        '404': { description: Requested record not found }
  /v1/discovery/rounds/{round_id}/settlement:
    get:
      operationId: discoverySettlement
      summary: Immutable provisional settlement plan
      parameters:
        - name: round_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Immutable provisional settlement plan
          content:
            application/json:
              schema:
                $ref: '../schemas/discovery-settlement-plan.schema.json'
        '400': { description: Invalid identifier or unavailable evidence }
        '401': { description: Missing or invalid API authentication }
        '404': { description: Requested record not found }
  /v1/discovery/rounds/{round_id}/submissions/{submission_id}/evidence:
    get:
      operationId: discoveryEvidencePublication
      summary: Revalidated exact certificate publication payload
      parameters:
        - name: round_id
          in: path
          required: true
          schema: { type: string }
        - name: submission_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revalidated exact certificate publication payload
          content:
            application/json:
              schema:
                type: object
        '400': { description: Invalid identifier or unavailable evidence }
        '401': { description: Missing or invalid API authentication }
        '404': { description: Requested record not found }
  /health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [status, protocol, time]
                properties:
                  status: { type: string }
                  protocol: { const: "XLMP/1" }
                  time: { type: string, format: date-time }
  /xlmp/v1/messages:
    post:
      operationId: acceptXlmpMessage
      summary: Verify an authorized Ed25519 signature and append an XLMP/1 message
      description: >-
        Canonical ingress for all XLMP/1 object families, including sovereignty,
        portability, economic constitutions and compliance, generalized
        verification profiles, committed reproduction observations, research
        certificates, node economics, capture dashboards, and constitutional
        governance. Observation reveals require a prior node-bound commit;
        certificates may use only observations already authenticated here.
      requestBody:
        required: true
        content:
          "application/x-xlmp+json;version=1":
            schema: { $ref: ../schemas/xlmp-envelope.schema.json }
          application/json:
            schema: { $ref: ../schemas/xlmp-envelope.schema.json }
      responses:
        "202":
          description: Immutable XLMP message accepted
          content:
            application/json:
              schema: { $ref: ../schemas/xlmp-envelope.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /xlmp/v1/messages/{messageId}:
    get:
      operationId: getXlmpMessage
      summary: Retrieve an accepted XLMP/1 message by content-derived ID
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: string, pattern: "^xlmessage:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Canonical XLMP envelope
          content:
            application/json:
              schema: { $ref: ../schemas/xlmp-envelope.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/credentials/users:
    post:
      operationId: publishUserCredential
      summary: Append a pseudonymous verified-participant credential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/user-credential.schema.json }
      responses:
        "201": { description: User credential appended }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/credentials/operators:
    post:
      operationId: publishOperatorCredential
      summary: Append a verified-participant delegation to an operator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/operator-credential.schema.json }
      responses:
        "201": { description: Operator credential appended }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/credentials/nodes:
    post:
      operationId: publishNodeCredential
      summary: Append an operator delegation to a node key and exact roles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/node-credential.schema.json }
      responses:
        "201": { description: Node credential appended }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/credentials/revocations:
    post:
      operationId: publishCredentialRevocation
      summary: Append an effective revocation for an exact credential
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/credential-revocation.schema.json }
      responses:
        "201": { description: Credential revocation appended }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/node-advertisements:
    post:
      operationId: publishNodeAdvertisement
      summary: Append a signed XLMP node capability, capacity, latency, and price advertisement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/node-service-advertisement.schema.json }
      responses:
        "201":
          description: Advertisement appended without replacing historical sequences
          content:
            application/json:
              schema: { $ref: ../schemas/node-service-advertisement.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/node-discovery:
    post:
      operationId: discoverNodeServices
      summary: Discover services using explicit price, capacity, checker, reputation, and independence constraints
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/node-discovery-request.schema.json }
      responses:
        "200":
          description: Content-committed ordered advertisement set
          content:
            application/json:
              schema: { $ref: ../schemas/node-discovery-result.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/service-orders:
    post:
      operationId: submitServiceOrder
      summary: Append demand and match it to one exact advertisement sequence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/service-order.schema.json }
      responses:
        "201":
          description: Immutable service-capacity reservation; payment remains separate
          content:
            application/json:
              schema: { $ref: ../schemas/service-match.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/committee-sortitions:
    post:
      operationId: selectCommittee
      summary: Reproduce committee selection from a committed eligible set and future randomness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request, eligible_nodes]
              properties:
                request: { $ref: ../schemas/committee-sortition-request.schema.json }
                eligible_nodes:
                  type: array
                  minItems: 1
                  maxItems: 1024
                  items: { $ref: ../schemas/eligible-node.schema.json }
      responses:
        "201":
          description: Auditable committee with member rank hashes and a selection root
          content:
            application/json:
              schema: { $ref: ../schemas/committee-selection.schema.json }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/researchers:
    post:
      operationId: registerResearcher
      summary: Register a decentralized researcher manifest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/researcher-node.schema.json
      responses:
        "201": { description: Researcher registered }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/researchers/{researcherId}:
    get:
      operationId: getResearcher
      parameters:
        - $ref: "#/components/parameters/ResearcherId"
      responses:
        "200":
          description: Researcher manifest
          content:
            application/json:
              schema:
                $ref: ../schemas/researcher-node.schema.json
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/research-credits/{creditId}:
    get:
      operationId: getResearchCredit
      summary: Retrieve one fully backed credit issuance
      parameters:
        - in: path
          name: creditId
          required: true
          schema: { type: string, pattern: "^xlcredit:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Research credit issuance
          content:
            application/json:
              schema: { $ref: ../schemas/research-credit.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/research-vaults/{vaultId}:
    get:
      operationId: getResearchVault
      summary: Retrieve the newest accepted snapshot for a research vault
      parameters:
        - in: path
          name: vaultId
          required: true
          schema: { type: string, pattern: "^xlvault:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Latest solvent vault snapshot
          content:
            application/json:
              schema: { $ref: ../schemas/research-vault.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/theories/{theoryId}:
    get:
      operationId: getTheory
      summary: Retrieve a theory projected from accepted XLMP history
      parameters:
        - in: path
          name: theoryId
          required: true
          schema: { type: string, pattern: "^xlt:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Theory manifest
          content:
            application/json:
              schema: { $ref: ../schemas/theory.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/claims:
    post:
      operationId: commitClaim
      summary: Commit a formal claim manifest and priority evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim, origin_certificate, contribution_manifest, rights_manifest]
              properties:
                claim: { $ref: ../schemas/claim.schema.json }
                origin_certificate: { type: object, additionalProperties: true }
                contribution_manifest: { $ref: ../schemas/contribution.schema.json }
                rights_manifest: { $ref: ../schemas/rights.schema.json }
      responses:
        "201": { description: Claim committed }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/claims/{claimId}:
    get:
      operationId: getClaim
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Immutable claim manifest
          content:
            application/json:
              schema: { $ref: ../schemas/claim.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/contributions/{manifestHash}:
    get:
      operationId: getContributionManifest
      summary: Retrieve an immutable contribution manifest by committed root
      parameters:
        - in: path
          name: manifestHash
          required: true
          schema: { type: string, pattern: "^blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Contribution manifest
          content:
            application/json:
              schema: { $ref: ../schemas/contribution.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/rights/{manifestHash}:
    get:
      operationId: getRightsManifest
      summary: Retrieve an immutable rights manifest by committed root
      parameters:
        - in: path
          name: manifestHash
          required: true
          schema: { type: string, pattern: "^blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Rights manifest
          content:
            application/json:
              schema: { $ref: ../schemas/rights.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/claims/{claimId}/formalize:
    post:
      operationId: formalizeClaim
      summary: Start a metered formalization through a ResearchProver adapter
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormalizationRequest"
      responses:
        "200": { description: Candidate formal claim and provider-neutral compute receipt }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /v1/claims/{claimId}/prove:
    post:
      operationId: proveClaim
      summary: Start proof search through a ResearchProver adapter
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProofSearchRequest"
      responses:
        "200": { description: Proof candidate and generation receipt }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /v1/claims/{claimId}/review-novelty:
    post:
      operationId: reviewNovelty
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "202": { description: Novelty committee job accepted }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /v1/proofs/{proofId}/verify:
    post:
      operationId: verifyProof
      summary: Start a PoIR formal-verification job
      parameters:
        - $ref: "#/components/parameters/ProofId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyProofRequest"
      responses:
        "202": { description: Verification job accepted }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /v1/proofs/{proofId}:
    get:
      operationId: getProof
      summary: Retrieve an immutable proof projected from accepted XLMP history
      parameters:
        - $ref: "#/components/parameters/ProofId"
      responses:
        "200":
          description: Proof manifest
          content:
            application/json:
              schema: { $ref: ../schemas/proof.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/certificates/{certificateId}:
    get:
      operationId: getPoIRCertificate
      summary: Retrieve an independently reproduced PoIR certificate
      parameters:
        - in: path
          name: certificateId
          required: true
          schema: { type: string, pattern: "^xlcert:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: PoIR certificate
          content:
            application/json:
              schema: { $ref: ../schemas/poir-certificate.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/compute-receipts/{receiptId}:
    get:
      operationId: getComputeReceipt
      summary: Retrieve a provider-neutral compute receipt
      parameters:
        - in: path
          name: receiptId
          required: true
          schema: { type: string, pattern: "^xlr:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Compute receipt
          content:
            application/json:
              schema: { $ref: ../schemas/compute-receipt.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/proofs/{proofId}/explain:
    post:
      operationId: explainProof
      parameters:
        - $ref: "#/components/parameters/ProofId"
      responses:
        "200": { description: LaTeX explanation and provider-neutral compute receipt }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /v1/proofs/{proofId}/bundle:
    get:
      operationId: getCertifiedBundle
      parameters:
        - $ref: "#/components/parameters/ProofId"
      responses:
        "200":
          description: Public or encrypted content-addressed bundle
          content:
            application/vnd.xlemma.bundle+json:
              schema:
                $ref: ../schemas/artifact.schema.json
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /v1/verification-jobs:
    post:
      operationId: createVerificationJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVerificationJob"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationJob" }
  /v1/verification-jobs/{jobId}:
    get:
      operationId: getVerificationJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Current job state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationJob" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/verification-jobs/{jobId}/observations:
    post:
      operationId: submitObservation
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/xlmp-envelope.schema.json }
      responses:
        "200": { description: Observation appended }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/verification-jobs/{jobId}/evaluate:
    post:
      operationId: evaluateVerificationJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Formal consensus outcome }
  /v1/compute/offers:
    get:
      operationId: listComputeOffers
      parameters:
        - in: query
          name: service
          schema: { type: string }
        - in: query
          name: deliveryBefore
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Signed service offers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: ../schemas/compute-offer.schema.json }
    post:
      operationId: publishComputeOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: ../schemas/compute-offer.schema.json }
      responses:
        "201": { description: Offer published }
  /v1/compute/quote:
    post:
      operationId: quoteResearchJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_work, deadline, success_estimates]
              properties:
                expected_work:
                  type: object
                  additionalProperties: { type: integer, minimum: 0 }
                deadline: { type: string, format: date-time }
                success_estimates: { $ref: ../schemas/protocol-success-estimates.schema.json }
                risk_premium_bps: { type: integer, minimum: 0, maximum: 10000 }
      responses:
        "200":
          description: Compute quote
          content:
            application/json:
              schema: { $ref: ../schemas/compute-quote.schema.json }
  /v1/lemmas/{lemmaId}:
    get:
      operationId: getLemmaCapsule
      parameters:
        - in: path
          name: lemmaId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Lemma capsule
          content:
            application/json:
              schema: { $ref: ../schemas/lemma-capsule.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/lemmas/{lemmaId}/license:
    post:
      operationId: acquireLicense
      parameters:
        - in: path
          name: lemmaId
          required: true
          schema: { type: string }
      responses:
        "200": { description: License manifest and settlement receipt }
        "402": { $ref: "#/components/responses/PaymentRequired" }
  /v1/publications/{publicationId}:
    get:
      operationId: getPublication
      summary: Retrieve an immutable publication projected from accepted XLMP history
      parameters:
        - in: path
          name: publicationId
          required: true
          schema: { type: string, pattern: "^xlpublication:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Publication record
          content:
            application/json:
              schema: { $ref: ../schemas/publication-record.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/licenses/{licenseId}:
    get:
      operationId: getLicense
      summary: Retrieve an immutable license projected from accepted XLMP history
      parameters:
        - in: path
          name: licenseId
          required: true
          schema: { type: string, pattern: "^xllicense:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: License record
          content:
            application/json:
              schema: { $ref: ../schemas/license.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/challenges/{challengeId}:
    get:
      operationId: getChallenge
      summary: Retrieve an append-only certificate challenge
      parameters:
        - in: path
          name: challengeId
          required: true
          schema: { type: string, pattern: "^xlchallenge:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Challenge record
          content:
            application/json:
              schema: { $ref: ../schemas/challenge.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/quarantines/{quarantineId}:
    get:
      operationId: getQuarantine
      summary: Retrieve an append-only quarantine record
      parameters:
        - in: path
          name: quarantineId
          required: true
          schema: { type: string, pattern: "^xlquarantine:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Quarantine record
          content:
            application/json:
              schema: { $ref: ../schemas/quarantine-record.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/revenue-events/{revenueEventId}:
    get:
      operationId: getRevenueEvent
      summary: Retrieve a settled, content-derived revenue event
      parameters:
        - in: path
          name: revenueEventId
          required: true
          schema: { type: string, pattern: "^xlrevenue:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Revenue event
          content:
            application/json:
              schema: { $ref: ../schemas/revenue-event.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/dependency-dividends/{dividendId}:
    get:
      operationId: getDependencyDividend
      summary: Retrieve one bounded, nonrecursive dependency allocation
      parameters:
        - in: path
          name: dividendId
          required: true
          schema: { type: string, pattern: "^xldividend:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Dependency dividend
          content:
            application/json:
              schema: { $ref: ../schemas/dependency-dividend.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/artifacts/{artifactId}/availability:
    get:
      operationId: getArtifactAvailability
      summary: Retrieve independent availability receipts for one artifact
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string, pattern: "^xla:blake3:[0-9a-f]{64}$" }
      responses:
        "200":
          description: Availability receipts
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                items: { $ref: ../schemas/availability.schema.json }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-256-bit-token
  parameters:
    ResearcherId:
      in: path
      name: researcherId
      required: true
      schema: { type: string }
    ClaimId:
      in: path
      name: claimId
      required: true
      schema: { type: string }
    ProofId:
      in: path
      name: proofId
      required: true
      schema: { type: string }
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string }
  schemas:
    FormalizationRequest:
      type: object
      required: [researcher_id, natural_language_claim, artifact_context_root]
      properties:
        researcher_id: { type: string }
        natural_language_claim: { type: string }
        latex_context: { type: [string, "null"] }
        lean_imports: { type: array, items: { type: string } }
        namespace: { type: string }
        theory_constraints: { type: array, items: { type: string } }
        artifact_context_root: { type: string }
        maximum_budget: { $ref: ../schemas/common.schema.json#/$defs/amount }
    ProofSearchRequest:
      type: object
      required: [researcher_id, lean_statement, current_lean_file, artifact_context_root]
      properties:
        researcher_id: { type: string }
        lean_statement: { type: string }
        current_lean_file: { type: string }
        compiler_diagnostics: { type: array, items: { type: string } }
        allowed_imports: { type: array, items: { type: string } }
        forbidden_axioms: { type: array, items: { type: string } }
        maximum_iterations: { type: integer, minimum: 1 }
        artifact_context_root: { type: string }
        maximum_budget: { $ref: ../schemas/common.schema.json#/$defs/amount }
    VerifyProofRequest:
      type: object
      required: [researcher_id, claim_id, theory_id, artifact_id, policy_id, maximum_budget]
      properties:
        researcher_id: { type: string }
        claim_id: { type: string }
        theory_id: { type: string }
        artifact_id: { type: string }
        policy_id: { type: string }
        maximum_budget: { $ref: ../schemas/common.schema.json#/$defs/amount }
        deadline: { type: string, format: date-time }
    CreateVerificationJob:
      type: object
      required: [researcher_id, claim_id, theory_id, artifact_id, artifact_root, policy, committee_members, maximum_budget_minor_units, settlement_asset]
      properties:
        researcher_id: { type: string }
        claim_id: { type: string }
        theory_id: { type: string }
        artifact_id: { type: string }
        artifact_root: { type: string, minLength: 16 }
        policy: { $ref: ../schemas/formal-consensus-policy.schema.json }
        committee_members:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: ../schemas/committee-selection.schema.json#/properties/members/items }
        maximum_budget_minor_units: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        settlement_asset: { type: string }
    VerificationJob:
      type: object
      additionalProperties: true
      required: [job_id, state, created_at, updated_at]
      properties:
        job_id: { type: string }
        state:
          type: string
          enum: [draft, claim_committed, quoted, funded, assigned, formalizing, candidate_ready, building, checkers_committed, checkers_revealed, passed, failed, divergent, challenged, finalized, rejected, quarantined, published, revalidated, superseded]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
  responses:
    PaymentRequired:
      description: Optional x402 payment authorization required
      headers:
        PAYMENT-REQUIRED:
          schema: { type: string }
          description: Base64-encoded x402 V2 JSON carrying an XLMP message binding
    BadRequest:
      description: Invalid request
    NotFound:
      description: Resource not found
    Conflict:
      description: State or identity conflict
